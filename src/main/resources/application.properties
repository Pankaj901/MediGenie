spring.application.name=MediGenie
spring.datasource.url=jdbc:h2:mem:medigeniedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=SA
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Logging SQL for debugging
spring.jpa.show-sql=true

# OpenAPI (Swagger UI) config (optional)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# openAI
spring.ai.openai.api-key=sk-abcdef1234567890abcdef1234567890abcdef12
spring.autoconfigure.exclude=org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration

# security
#spring.security.user.name=pkp
#spring.security.user.password=
spring.security.enabled=false

# JWT secret key
jwt.secret=PankajPalSuperSecretJwtKeyForMediGenie123!
jwt.expiration=36000000

# Email configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your.email@gmail.com
spring.mail.password=your_gmail_app_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000


